<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head><title>Create account</title></head>
<body>
<span layout:fragment="pageTitle">Create account</span>
<div layout:fragment="content" class="auth-wrap">
    <section class="panel auth-card" aria-labelledby="registration-title">
        <div class="auth-heading">
            <p class="eyebrow">A LITTLE MORE FOCUS</p>
            <h1 id="registration-title">Better practice starts here.</h1>
            <p>Create your Snooker Buddy account. One purposeful session at a time.</p>
        </div>
        <div class="auth-body">
            <form id="registrationForm" method="post" th:action="@{/registration}" th:object="${user}" class="space-y-5">
                <div>
                    <label for="name" class="field-label">Name <span class="required">*</span></label>
                    <input type="text" id="name" name="name" required autocomplete="name" th:field="*{name}" class="field"
                           th:classappend="${#fields.hasErrors('name')} ? 'field-error' : ''"
                           th:attr="aria-invalid=${#fields.hasErrors('name')},aria-describedby=${#fields.hasErrors('name')} ? 'name-error' : null" placeholder="Your name"/>
                    <p id="name-error" class="validation-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Name error</p>
                </div>
                <div>
                    <label for="email" class="field-label">Email <span class="required">*</span></label>
                    <input type="email" id="email" name="email" required autocomplete="email" th:field="*{email}" class="field"
                           th:classappend="${#fields.hasErrors('email')} ? 'field-error' : ''"
                           th:attr="aria-invalid=${#fields.hasErrors('email')},aria-describedby=${#fields.hasErrors('email')} ? 'email-error' : null" placeholder="you@example.com"/>
                    <p id="email-error" class="validation-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">Email error</p>
                </div>
                <div>
                    <label for="password" class="field-label">Password <span class="required">*</span></label>
                    <input type="password" id="password" name="password" required autocomplete="new-password" th:field="*{password}" class="field"
                           th:classappend="${#fields.hasErrors('password')} ? 'field-error' : ''"
                           th:attr="aria-invalid=${#fields.hasErrors('password')},aria-describedby=${#fields.hasErrors('password')} ? 'password-error' : null" placeholder="Choose a password"/>
                    <p id="password-error" class="validation-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}">Password error</p>
                </div>
                <button type="submit" class="btn btn-primary w-full">Create account <i class="fa-solid fa-arrow-right" aria-hidden="true"></i></button>
            </form>
            <p class="auth-footer">Already have an account? <a class="text-link" th:href="@{/login}">Sign in</a></p>
        </div>
    </section>
</div>
</body>
</html>
