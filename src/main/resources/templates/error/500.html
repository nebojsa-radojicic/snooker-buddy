<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head><title>Server error</title></head>
<body>
<span layout:fragment="pageTitle">Server error</span>
<div layout:fragment="content" class="error-wrap">
    <section class="panel error-card" aria-labelledby="error-title">
        <span class="feature-icon"><i class="fa-solid fa-rotate-right" aria-hidden="true"></i></span>
        <p class="error-code">500</p>
        <p class="eyebrow mb-3">SERVER ERROR</p>
        <h1 id="error-title" class="text-2xl font-extrabold tracking-tight">Let’s take a moment to reset.</h1>
        <p class="page-subtitle max-w-sm mx-auto">Something went wrong while processing your request. Please try again later.</p>
        <a th:href="@{/}" class="btn btn-primary mt-7"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i> Back to workspace</a>
    </section>
</div>
</body>
</html>
