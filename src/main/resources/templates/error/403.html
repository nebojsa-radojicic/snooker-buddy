<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head><title>Access denied</title></head>
<body>
<span layout:fragment="pageTitle">Access denied</span>
<div layout:fragment="content" class="error-wrap">
    <section class="panel error-card" aria-labelledby="error-title">
        <span class="feature-icon"><i class="fa-solid fa-lock" aria-hidden="true"></i></span>
        <p class="error-code">403</p>
        <p class="eyebrow mb-3">ACCESS DENIED</p>
        <h1 id="error-title" class="text-2xl font-extrabold tracking-tight">This part of the table is reserved.</h1>
        <p class="page-subtitle max-w-sm mx-auto">You do not have permission to access this resource.</p>
        <a th:href="@{/}" class="btn btn-primary mt-7"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i> Back to workspace</a>
    </section>
</div>
</body>
</html>
