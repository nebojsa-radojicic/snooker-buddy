<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head><title>New exercise</title></head>
<body>
<span layout:fragment="pageTitle">Exercise library</span>
<div layout:fragment="content"><section class="panel exercise-form-panel"><div class="library-heading"><div><h1 class="page-title">Save a new exercise</h1><p class="page-subtitle">Add your drawing and the instructions your player needs.</p></div><a class="iconbtn" th:href="@{/exercises}" aria-label="Back to library">×</a></div>
<form id="exercise-form" method="post" enctype="multipart/form-data" th:action="@{/exercises}" th:object="${exercise}" class="space-y-5">
<div th:if="${#fields.hasAnyErrors()}" class="notice notice-error" role="alert"><div><p>Please check the fields below. Choose your drawing again before saving.</p><ul><li th:each="error : ${#fields.allErrors()}" th:text="${error}"></li></ul></div></div>
<label class="drawing-upload" for="drawing"><i class="fa-solid fa-arrow-up-from-bracket text-2xl" aria-hidden="true"></i><strong class="block mt-3">Upload your exercise drawing</strong><span class="block text-xs mt-2">JPG, PNG or WebP · up to 20 MB</span><input class="block w-full text-xs mt-4" id="drawing" name="drawing" type="file" accept="image/jpeg,image/png,image/webp" required aria-describedby="drawing-help drawing-status"/><span id="drawing-help" class="block text-xs mt-3">Large photos are resized automatically.</span><img id="drawing-preview" alt="Preview of your exercise drawing" hidden/></label>
<p id="drawing-status" role="status" aria-live="polite" class="page-subtitle"></p>
<div><label class="field-label" for="name">Exercise name</label><input class="field" id="name" th:field="*{name}" maxlength="60" placeholder="e.g. The straight pot" required th:errorclass="field-error" th:attr="aria-invalid=${#fields.hasErrors('name')},aria-describedby='name-error'"/><p id="name-error" class="validation-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p></div><div><label class="field-label" for="description">Setup and instructions</label><textarea class="field" id="description" th:field="*{description}" maxlength="5000" placeholder="Explain the setup and how to play the exercise." required th:errorclass="field-error" th:attr="aria-invalid=${#fields.hasErrors('description')},aria-describedby='description-error'" rows="3"></textarea><p id="description-error" class="validation-error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></p></div><div><label class="field-label" for="goal">What counts as success?</label><textarea class="field" id="goal" th:field="*{goal}" maxlength="2000" placeholder="e.g. Pot the red and stop the cue ball within one ball width." required th:errorclass="field-error" th:attr="aria-invalid=${#fields.hasErrors('goal')},aria-describedby='goal-error'" rows="3"></textarea><p id="goal-error" class="validation-error" th:if="${#fields.hasErrors('goal')}" th:errors="*{goal}"></p></div><div class="grid grid-cols-1 sm:grid-cols-2 gap-4"><div><label for="type" class="field-label">Type</label><select class="field" th:field="*{type}" required><option th:each="item : ${types}" th:value="${item}" th:text="${item.label}"></option></select></div><div><label for="difficulty" class="field-label">Difficulty</label><select class="field" th:field="*{difficulty}" required><option th:each="item : ${difficulties}" th:value="${item}" th:text="${item.label}"></option></select></div></div>
<div class="flex justify-end gap-3 pt-3"><a class="btn btn-light" th:href="@{/exercises}">Cancel</a><button id="save-exercise" class="btn btn-primary" type="submit">Save exercise</button></div></form></section></div>
<th:block layout:fragment="pageScripts"><script defer th:src="@{/js/exercises.js}"></script></th:block></body></html>
