<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head><title>Assigned exercise</title></head><body>
<span layout:fragment="pageTitle">Training plans</span>
<div layout:fragment="content">
<section class="panel exercise-form-panel"><a class="text-link" th:href="@{/training/{id}(id=${plan.id})}">← Back to training</a><p class="eyebrow mt-5" th:text="${plan.name + ' · ' + plan.playerName}"></p><h1 class="page-title mt-3" th:text="${exercise.name}"></h1><img class="detail-drawing" th:src="@{/training/{id}/exercises/{exerciseId}/drawing(id=${plan.id},exerciseId=${exercise.id})}" th:alt="${'Drawing for ' + exercise.name}"/><div class="flex gap-2 mt-5"><span class="chip">Exercise type: <span th:text="${exercise.type.label}"></span></span><span class="chip">Exercise difficulty: <span th:text="${exercise.difficulty.label}"></span></span></div><h2 class="font-bold mt-6">How to practice</h2><p class="page-subtitle exercise-text" th:text="${exercise.description}"></p><h2 class="font-bold mt-6">What counts as success</h2><p class="page-subtitle exercise-text" th:text="${exercise.goal}"></p><div class="notice mt-6"><p>Personal target for this plan: <strong th:text="${plan.target + ' successful / ' + plan.attempts + ' attempts'}"></strong></p></div></section>
</div>
<th:block layout:fragment="pageScripts"><script defer th:src="@{/js/training.js}"></script></th:block>
</body></html>
