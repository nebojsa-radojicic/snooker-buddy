<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head><title>Record result</title></head><body>
<span layout:fragment="pageTitle">Training plans</span>
<div layout:fragment="content">
    <section class="panel exercise-form-panel">
        <a class="text-link" th:href="@{/training/{planId}/exercises/{exerciseId}(planId=${plan.id},exerciseId=${exercise.id})}">← Back to exercise</a>
        <h1 class="page-title mt-5" th:text="|Record result for ${exercise.name}|"></h1>
        <p class="page-subtitle" th:text="|${plan.playerName} · ${plan.name} · ${plan.kind.label} practice|"></p>
        <div class="notice mt-5">
            <p>Planned target <strong th:text="|${exercise.target} successful / ${exercise.attempts} attempts|"></strong></p>
            <p class="exercise-text mt-2" th:text="${exercise.goal}"></p>
        </div>
        <form class="space-y-5 mt-5" method="post" th:object="${result}"
              th:action="@{/training/{planId}/exercises/{exerciseId}/scores(planId=${plan.id},exerciseId=${exercise.id})}">
            <div class="notice notice-error" role="alert" th:if="${#fields.hasAnyErrors()}">
                <ul><li th:each="error : ${#fields.allErrors()}" th:text="${error}"></li></ul>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="field-label" for="total">Total attempts performed</label>
                    <input class="field" type="number" th:field="*{total}" min="1" step="1" required />
                </div>
                <div>
                    <label class="field-label" for="successful">Successful attempts</label>
                    <input class="field" type="number" th:field="*{successful}" min="0" step="1" required />
                </div>
            </div>
            <button type="submit" class="btn btn-primary">Save result</button>
        </form>
    </section>
</div>
</body></html>
