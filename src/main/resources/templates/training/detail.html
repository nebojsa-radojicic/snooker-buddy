<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head><title>Training details</title></head><body>
<span layout:fragment="pageTitle">Training plans</span>
<div layout:fragment="content">
<section class="panel exercise-form-panel"><a class="text-link" th:href="@{/training}">← Back to training plans</a><h1 class="page-title mt-5" th:text="${plan.name}"></h1>
<div class="flex flex-wrap gap-2 mt-5"><span class="chip" th:text="${plan.playerName}"></span><span class="chip" th:text="${plan.kind.label + ' practice'}"></span><span class="chip" th:text="${plan.format.label}"></span><span class="chip">Assigned</span></div>
<p class="page-subtitle">Coach: <span th:text="${plan.coachName}"></span></p><p class="page-subtitle" th:text="${plan.kind.name() == 'JOINT' ? 'Practice together with your coach.' : 'Follow the exercises during your independent practice.'}"></p>
<ol class="plan-details"><li th:each="exercise : ${plan.exercises}"><div class="flex flex-wrap justify-between gap-3"><h2 class="font-bold"><a th:href="@{/training/{id}/exercises/{exerciseId}(id=${plan.id},exerciseId=${exercise.id})}" th:text="${exercise.name}"></a></h2><span class="chip" th:text="${plan.target + ' / ' + plan.attempts + ' target'}"></span></div><p class="page-subtitle exercise-text" th:text="${exercise.goal}"></p><a class="btn btn-light mt-4" th:href="@{/training/{id}/exercises/{exerciseId}(id=${plan.id},exerciseId=${exercise.id})}">View exercise →</a></li></ol>
</section>
</div>
<th:block layout:fragment="pageScripts"><script defer th:src="@{/js/training.js}"></script></th:block>
</body></html>
