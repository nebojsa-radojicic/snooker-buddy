<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head><title>Training history</title></head><body>
<span layout:fragment="pageTitle">Training history</span>
<div layout:fragment="content">
<div th:if="${playerName != null}">
    <a class="text-link" th:href="@{/scores}">← All training history</a>
    <h1 class="page-title mt-3" th:text="|${playerName} · Training history|"></h1>
</div>
<div th:unless="${playerName != null}">
    <h1 class="page-title" sec:authorize="hasRole('COACH')">Training history</h1>
    <h1 class="page-title" sec:authorize="!hasRole('COACH')">My results</h1>
</div>
<section th:if="${scores.isEmpty()}" class="panel empty-state"><h2 class="font-bold">No scores recorded yet</h2></section>
<div class="table-wrap panel mt-5" th:unless="${scores.isEmpty()}">
<table class="w-full text-left"><thead><tr><th>Player</th><th>Exercise</th><th>Practice type</th><th>Actual successful / total attempts</th><th>Recorded</th></tr></thead>
<tbody><tr th:each="score : ${scores}">
<td th:text="${score.playerName}"></td>
<td><a class="text-link" th:href="@{/training/{planId}/exercises/{exerciseId}(planId=${score.planId},exerciseId=${score.exerciseId})}" th:text="${score.exerciseName}"></a></td>
<td th:text="${score.kind.label}"></td>
<td th:text="${score.successful + ' / ' + score.total}"></td>
<td th:text="${#temporals.format(score.createdAt, 'dd MMM yyyy HH:mm', 'UTC')}"></td>
</tr></tbody></table>
</div>
<p class="page-subtitle mt-4">Scores describe exercise performance, not an overall player level.</p>
</div></body></html>
