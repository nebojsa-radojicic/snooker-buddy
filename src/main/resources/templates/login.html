<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head><title>Sign in</title></head>
<body>
<span layout:fragment="pageTitle">Sign in</span>
<div layout:fragment="content" class="auth-wrap">
    <section class="panel auth-card" aria-labelledby="login-title">
        <div class="auth-heading">
            <p class="eyebrow">YOUR PRACTICE, WITH PURPOSE</p>
            <h1 id="login-title">Welcome back.</h1>
            <p>A little structure. A lot of progress. Sign in to your Snooker Buddy workspace.</p>
        </div>
        <div class="auth-body">
            <div th:if="${param.error}" class="notice notice-error" role="alert">
                <i class="fa-solid fa-circle-exclamation" aria-hidden="true"></i><p>Invalid email or password.</p>
            </div>
            <div th:if="${message}" class="notice" role="status"><p th:text="${message}"></p></div>
            <div th:if="${param.logout}" class="notice" role="status">
                <i class="fa-regular fa-circle-check" aria-hidden="true"></i><p>You have been logged out.</p>
            </div>
            <form id="loginForm" method="post" th:action="@{/login}" class="space-y-5">
                <div>
                    <label for="username" class="field-label">Email <span class="required">*</span></label>
                    <input type="email" id="username" name="username" required autocomplete="email" class="field" placeholder="you@example.com"/>
                </div>
                <div>
                    <label for="password" class="field-label">Password <span class="required">*</span></label>
                    <input type="password" id="password" name="password" required autocomplete="current-password" class="field" placeholder="Enter your password"/>
                </div>
                <button type="submit" class="btn btn-primary w-full">Sign in <i class="fa-solid fa-arrow-right" aria-hidden="true"></i></button>
            </form>
            <p class="auth-footer">New to Snooker Buddy? <a class="text-link" th:href="@{/registration}">Create an account</a></p>
        </div>
    </section>
</div>
</body>
</html>
